services:
  - type: web
    name: missioncontrol-dashboard
    runtime: python
    buildCommand: pip install -r requirements.txt
    # Dashboard inicia a migração de alocações (CSVs -> Supabase) em thread na subida; logs no Render.
    startCommand: python productsPositions/scripts/servidor_dashboard.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: SUPABASE_DB_URL
        sync: false
      - key: GECKO_API_KEY
        sync: false
      - key: BITGET_API_KEY_SOROS_SPOT
        sync: false
      - key: BITGET_SECRET_KEY_SOROS_SPOT
        sync: false
      - key: BITGET_PASSPHRASE_SOROS_SPOT
        sync: false
      - key: BITGET_API_KEY_SOROS_PERP_TUOS
        sync: false
      - key: BITGET_SECRET_KEY_SOROS_PERP_TUOS
        sync: false
      - key: BITGET_PASSPHRASE_SOROS_PERP_TUOS
        sync: false
      - key: BITGET_API_KEY_MEMEBOT_PERP_TUOS
        sync: false
      - key: BITGET_SECRET_KEY_MEMEBOT_PERP_TUOS
        sync: false
      - key: BITGET_PASSPHRASE_MEMEBOT_PERP_TUOS
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
