services:
  - type: web
    name: missioncontrol-dashboard
    runtime: python
    buildCommand: pip install -r requirements.txt
    # Gunicorn: multiplos workers, mais estavel sob carga (usa app_wsgi que faz proxy ao dashboard)
    startCommand: python productsPositions/scripts/deploy_migrate_precos.py; python productsPositions/scripts/deploy_migrate_allocations.py; python productsPositions/scripts/deploy_cleanup_spot1.py; python productsPositions/scripts/deploy_cleanup_spot2.py; python productsPositions/scripts/deploy_rename_soros_perpetuos.py; python productsPositions/scripts/deploy_rename_memebot_perpetuos.py; gunicorn -w 2 -b 0.0.0.0:$PORT --timeout 300 productsPositions.scripts.app_wsgi:app
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: SUPABASE_DB_URL
        sync: false
      - key: GECKO_API_KEY
        sync: false
      - key: BITGET_API_KEY_SOROS_SPOT
        sync: false
      - key: BITGET_SECRET_KEY_SOROS_SPOT
        sync: false
      - key: BITGET_PASSPHRASE_SOROS_SPOT
        sync: false
      - key: BITGET_API_KEY_SOROS_PERP_TUOS
        sync: false
      - key: BITGET_SECRET_KEY_SOROS_PERP_TUOS
        sync: false
      - key: BITGET_PASSPHRASE_SOROS_PERP_TUOS
        sync: false
      - key: BITGET_API_KEY_MEMEBOT_PERP_TUOS
        sync: false
      - key: BITGET_SECRET_KEY_MEMEBOT_PERP_TUOS
        sync: false
      - key: BITGET_PASSPHRASE_MEMEBOT_PERP_TUOS
        sync: false
      - key: BITGET_API_KEY_SOROS_SPOT_2
        sync: false
      - key: BITGET_SECRET_KEY_SOROS_SPOT_2
        sync: false
      - key: BITGET_PASSPHRASE_SOROS_SPOT_2
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
