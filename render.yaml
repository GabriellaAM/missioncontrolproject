services:
  - type: web
    name: missioncontrol-dashboard
    runtime: python
    buildCommand: pip install -r requirements.txt
    # Migração one-shot: atualiza alocações no Supabase (CSVs AC, EXC, HB, LC). Após rodar, remova o "migrar_alocacoes_para_supabase.py && " e delete o script.
    startCommand: python productsPositions/scripts/migrar_alocacoes_para_supabase.py && python productsPositions/scripts/servidor_dashboard.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: SUPABASE_DB_URL
        sync: false
      - key: GECKO_API_KEY
        sync: false
      - key: BITGET_API_KEY_SOROS_SPOT
        sync: false
      - key: BITGET_SECRET_KEY_SOROS_SPOT
        sync: false
      - key: BITGET_PASSPHRASE_SOROS_SPOT
        sync: false
      - key: BITGET_API_KEY_SOROS_PERP_TUOS
        sync: false
      - key: BITGET_SECRET_KEY_SOROS_PERP_TUOS
        sync: false
      - key: BITGET_PASSPHRASE_SOROS_PERP_TUOS
        sync: false
      - key: BITGET_API_KEY_MEMEBOT_PERP_TUOS
        sync: false
      - key: BITGET_SECRET_KEY_MEMEBOT_PERP_TUOS
        sync: false
      - key: BITGET_PASSPHRASE_MEMEBOT_PERP_TUOS
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
